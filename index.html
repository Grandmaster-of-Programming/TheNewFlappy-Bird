<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird Mini App</title>
    <script src="https://telegram.org"></script>
    <style>
        body { margin: 0; background: #70c5ce; overflow: hidden; font-family: sans-serif; text-align: center; }
        canvas { display: block; margin: 0 auto; background: #70c5ce; max-width: 100%; max-height: 100vh; }
    </style>
</head>
<body>
    <canvas id="game" width="320" height="480"></canvas>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        let bird = { x: 50, y: 150, v: 0, r: 12, g: 0.25, jump: -4.6 };
        let pipes = [];
        let score = 0;
        let gameOver = false;

        function spawnPipe() {
            let gap = 120;
            let topHeight = Math.random() * (canvas.height - gap - 100) + 30;
            pipes.push({ x: canvas.width, top: topHeight, bottom: canvas.height - topHeight - gap });
        }
        spawnPipe();

        function reset() {
            bird.y = 150; bird.v = 0; pipes = []; score = 0; gameOver = false; spawnPipe();
        }

        window.addEventListener("touchstart", () => { 
            if(gameOver) reset(); else bird.v = bird.jump; 
        });
        window.addEventListener("mousedown", () => { 
            if(gameOver) reset(); else bird.v = bird.jump; 
        });

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (!gameOver) {
                bird.v += bird.g;
                bird.y += bird.v;
            }
            ctx.fillStyle = "#f39c12";
            ctx.beginPath(); ctx.arc(bird.x, bird.y, bird.r, 0, Math.PI*2); ctx.fill();

            if (bird.y + bird.r > canvas.height || bird.y - bird.r < 0) gameOver = true;

            for (let i = pipes.length - 1; i >= 0; i--) {
                if (!gameOver) pipes[i].x -= 2;

                ctx.fillStyle = "#2ecc71";
                ctx.fillRect(pipes[i].x, 0, 50, pipes[i].top);
                ctx.fillRect(pipes[i].x, canvas.height - pipes[i].bottom, 50, pipes[i].bottom);

                if (bird.x + bird.r > pipes[i].x && bird.x - bird.r < pipes[i].x + 50) {
                    if (bird.y - bird.r < pipes[i].top || bird.y + bird.r > canvas.height - pipes[i].bottom) {
                        gameOver = true;
                    }
                }

                if (pipes[i].x === 30 && !gameOver) { score++; }
                if (pipes[i].x < -50) pipes.splice(i, 1);
            }

            if (pipes.length > 0 && pipes[pipes.length - 1].x < canvas.width - 160) spawnPipe();

            ctx.fillStyle = "#fff"; ctx.font = "24px sans-serif";
            ctx.fillText("Счет: " + score, 20, 40);

            if (gameOver) {
                ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = "#fff"; ctx.font = "30px sans-serif";
                ctx.fillText("Игра окончена", 60, canvas.height/2);
                ctx.font = "16px sans-serif";
                ctx.fillText("Нажми, чтобы начать заново", 50, canvas.height/2 + 40);
            }
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
